services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: taskflow-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: taskflow-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/taskflow
    depends_on:
      - mongo
    volumes:
      - ./backend:/app

  mongo:
    image: mongo:5.0
    container_name: mongo_taskflow
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data_taskflow:/data/db

volumes:
  mongo_data_taskflow:
